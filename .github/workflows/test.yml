name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lua-version: ["5.1", "5.2", "5.3", "5.4", "luajit"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Lua ${{ matrix.lua-version }}
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua-version }}

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install dependencies
        run: |
          luarocks install busted

      - name: Run tests
        run: |
          export LUA_PATH="./?.lua;$(lua -e 'print(package.path)')"
          busted --verbose --output=plainTerminal

      - name: Test summary
        if: always()
        run: |
          echo "### Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Lua version: ${{ matrix.lua-version }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: |
          luarocks install luacheck

      - name: Run luacheck
        run: |
          # Luacheck with relaxed settings for Hammerspoon globals
          luacheck . --exclude-files tmp-npm-cache/ spec/ \
            --globals hs \
            --max-line-length 120 \
            --no-unused-args \
            --ignore 212 \
            || true  # Don't fail on linting issues yet

  test-summary:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "All tests completed"
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ Tests passed"
          else
            echo "❌ Tests failed"
            exit 1
          fi
